name : my-first workflow
on :
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name : clone app
        uses : actions/checkout@v5
      - name : setup node
        uses : actions/setup-node@v5
        with :
          node-version: 24
      - name : install dependencies
        run : npm ci
      - name: Check Docker username secret
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
          echo "❌ DOCKER_USERNAME is EMPTY"
          exit 1
          else
          echo "✅ DOCKER_USERNAME is configured"
          fi
      - name : build app
        run : npm run build
      - name : build docker img
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/react-ci-cd:v1 .
      - name : docker login
        uses : docker/login-action@v3
        with :
          username : ${{ secrets.DOCKER_USERNAME }}
          password : ${{ secrets.DOCKER_TOKEN }}
      - name : push docker img
        run : docker push ${{ secrets.DOCKER_USERNAME }}/react-ci-cd:v1
      
        