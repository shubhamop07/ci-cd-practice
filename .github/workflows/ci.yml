name : my-first workflow
on :
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name : clone app
        uses : actions/checkout@v4
      - name : setup node
        uses : actions/setup-node@v4
        with :
          node-version: 22
      - name : install dependencies
        run : npm ci
      - name : build app
        run : npm run build
        